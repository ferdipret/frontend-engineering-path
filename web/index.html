<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FE Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<script>try { const t = localStorage.getItem('fe-path-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<div class="layout">
  <nav id="nav" aria-label="Modules"></nav>
  <main id="main"></main>
</div>

<dialog id="search" aria-label="Search">
  <div class="search-box">
    <input id="search-input" type="search" placeholder="Search skills, guides, tests, and links…" autocomplete="off" spellcheck="false"
      role="combobox" aria-expanded="true" aria-controls="search-results" aria-autocomplete="list">
    <kbd>Esc</kbd>
  </div>
  <div id="search-chips" class="search-chips"></div>
  <div id="search-results" class="search-results" role="listbox" aria-label="Results"></div>
  <div class="search-foot">
    <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span><kbd>Enter</kbd> open</span>
    <span>Filters: <code>is:todo</code> <code>is:done</code> <code>type:quiz</code> <code>in:css</code> <code>"exact phrase"</code></span>
  </div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
